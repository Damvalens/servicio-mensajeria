<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat UA</title>
	<!-- Google AdSense -->
    <meta name="google-adsense-account" content="ca-pub-7456403879639880">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7456403879639880"
     crossorigin="anonymous"></script>
    <style>
        body { font-family: Arial, sans-serif; }
        #messages { list-style-type: none; padding: 0; }
        #messages li { padding: 8px; background: #f1f1f1; margin-bottom: 5px; }
    </style>
</head>
<body>
    <h1>CHAT UA</h1>
    <ul id="messages"></ul>
    <input id="message" autocomplete="off" /><button id="send">Enviar</button>
    <br><br>
    <button id="startCall">Iniciar Llamada de Video</button>
    <button id="startVoiceCall">Iniciar Llamada de Voz</button>
    <button id="stopCall">Detener Llamada</button>
	<button id="muteMic">Mutear Micrófono</button>
	<label for="volumeControl">Volumen:</label>
    <input id="volumeControl" type="range" min="0" max="100" value="100">
	<p>Duración de la Llamada: <span id="callDuration">00:00</span></p>
	


    <br><br>
    <video id="localVideo" autoplay muted></video>
    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>
</html>
